[DEFAULT]
VENV = /opt/argo-automation-cpas/

[general]
loggers = stdout, file, syslog
log_level = INFO
log_file = %(VENV)svar/log/argo-cpas.log
syslog_address = /dev/log
syslog_facility = user
request_timeout = 30.0
verify_ssl = True
retries = 3
retry_delay = 5.0
strip_ansi = True
daemon_sleep = 10

[automation]
#tenants =
#filter_tenants = TEST-
tenants = AUTOMATION
filter_tenants = TEST-

[ams]
project = project-ARGO-MON-AUTOMATION
host = host-API_DEVEL_MSG_ARGO
subscription = AMS-sub-events
token = token-AMS
pullmsgs = 10
ack = True
return_immediately = True
events = INIT_TOPOLOGY_CONNECTOR, INIT_POEM, INIT_MONITORING_BOX
#components = argo-monbox
components = argo-monbox, argo-archiver
token_component_admin = token-component-AMS
url_api_integrations = /v1/integrations/{component}/by-project-name/{tenant_name}/refresh
tokens_spool = tests/tokens_ams.json


[webapi]
host = host-API_DEVEL_MON_ARGO
url_api_config = /api/v2/feeds/topology
url_api_integrations = /api/v3/integrations/components/{component}/by-tenant-name/{tenant_name}/refresh
token_component_admin = token-component-WEBAPI
components = connector, poem-viewer, poem-admin, monbox
tokens_spool = tests/tokens_webapi.json

[statusapi]
api =  https://API-STATUS_MON_ARGO/v1/automation/tenants/{tenant_id}/status

[iam]
api = https://LOGIN-DEVEL-IAM/auth/realms/einfra/protocol/openid-connect/token
oidc_client_id = topology.connector.integration.service
oidc_client_secret = OIDC_SECRET
token_spool = %(VENV)svar/spool/iam_access.yaml

[ansible]
user_connector = user
group_connector = user
ssh_private_key = /home/user/.ssh/sshkey
defaults_file = %(VENV)setc/roles-defaults.yml
tokens_manual = %(VENV)setc/tokens.yml
connectors_playbook = connectors.yml
connectors_inventory = connectors.ini
poem_playbook = poem.yml
poem_inventory = poem.ini
poem_fqdn_suffix = POEM-DEVEL-MON-ARGO
poem_superuserpassword = POEM_SUPERUSER_SECRET
poem_restapi_token = tests/tokens_restapi.json
user_sensu = rocky
sensu_inventory = sensu.ini

[monboxgit]
git_repo_owner = ARGOeu
git_repo_name = argo-mon-deployment
git_ssh_key_path = %(VENV)setc/argo_mon_deploy_git_ssh_key
git_branch_backend = sensu_backend_auto_devel_mon_argo_grnet_gr
backend_config_file_path = data/default.yaml
git_branch_agent = sensu_agent_auto_devel_mon_argo_grnet_gr
agent_config_file_path = data/default.yaml
init_check_count = 10
init_check_interval = 150

# vim: ft=conf
