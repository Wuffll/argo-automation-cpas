---

- name: Check if poem.auto.conf exists
  ansible.builtin.stat:
    path: "{{ poem_virtenv_path }}/etc/poem/poem.auto.conf"
  register: poem_conf_file_exists


- name: Initialize empty poem_conf_file content
  ansible.builtin.set_fact:
    poem_conf_file:
      content: ''
  when: not poem_conf_file_exists.stat.exists


- name: Read poem.auto.conf - {{ item.tenant_name }}
  ansible.builtin.slurp:
    src: "{{ poem_virtenv_path }}/etc/poem/poem.auto.conf"
  register: poem_conf_content
  when: poem_conf_file_exists.stat.exists


- name: Set content poem_conf_file from readed poem.auto.conf
  ansible.builtin.set_fact:
    poem_conf_file:
      content: "{{ poem_conf_content }}"
  when: poem_conf_file_exists.stat.exists


- name: Check tenant poem.auto.conf sections - {{ item.tenant_name }}
  ansible.builtin.set_fact:
    poem_conf_lines: "{{ (poem_conf_file.content | b64decode).splitlines() }}"
    poem_general_section_exists: >-
      {{ ('[GENERAL_' ~ item.tenant_name ~ ']') in (poem_conf_file.content | b64decode).splitlines() }}
    poem_superuser_section_exists: >-
      {{ ('[SUPERUSER_' ~ item.tenant_name ~ ']') in (poem_conf_file.content | b64decode).splitlines() }}


- name: Append GENERAL section to poem.auto.conf - {{ item.tenant_name }}
  ansible.builtin.blockinfile:
    path: "{{ poem_virtenv_path }}/etc/poem/poem.auto.conf"
    marker: "# {mark} ANSIBLE MANAGED GENERAL_{{ item.tenant_name }}"
    insertafter: EOF
    create: true
    prepend_newline: true
    append_newline: true
    block: |
      [GENERAL_{{ item.tenant_name }}]
      Namespace = {{ item.tenant_namespace }}
      SamlLoginString = {{ item.tenant_samlloginstring }}
      SamlServiceName = {{ item.tenant_samlservicename }}
      TermsOfUse = {{ item.tenant_termsofuse }}
      PrivacyPolicies = {{ item.tenant_privacypolicies }}
      {% if item.tenant_servicetitles | default(false) %}
      UseServiceTitles = {{ item.tenant_servicetitles }}
      {% endif %}
    owner: "{{ poem_owner }}"
    group: "{{ poem_group }}"
    mode: "0644"
  when: not poem_general_section_exists
  notify: Restart apache


- name: Append SUPERUSER section to poem.auto.conf - {{ item.tenant_name }}
  ansible.builtin.blockinfile:
    path: "{{ poem_virtenv_path }}/etc/poem/poem.auto.conf"
    marker: "# {mark} ANSIBLE MANAGED SUPERUSER_{{ item.tenant_name }}"
    insertafter: EOF
    prepend_newline: true
    append_newline: true
    block: |
      [SUPERUSER_{{ item.tenant_name }}]
      Name = {{ item.tenant_superuser_name }}
      Password = {{ item.tenant_superuser_password }}
      Email = {{ item.tenant_superuser_email }}
    owner: "{{ poem_owner }}"
    group: "{{ poem_group }}"
    mode: "0644"
  when: not poem_superuser_section_exists
  notify: Restart apache
