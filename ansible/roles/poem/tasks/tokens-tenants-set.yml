---

- name: Query whether WEB-API token exist - {{ item.tenant_name }}
  vars:
    ansible_python_interpreter: "{{ poem_virtenv_path }}/bin/python"
  community.postgresql.postgresql_query:
    db: "{{ poem_db_name }}"
    login_host: localhost
    login_user: "{{ poem_db_user }}"
    login_password: "{{ poem_db_password }}"
    search_path: public
    query: "SELECT 1 FROM poem_super_admin_webapikey where name='WEB-API-{{ item.tenant_name | upper }}'"
  register: poem_token_query
  failed_when: false


- name: Set WEB-API and WEB-API-RO tokens - {{ item.tenant_name }}
  ansible.builtin.shell:
    cmd: |
      source {{ poem_virtenv_path }}/bin/activate
      poem-token webapi -t {{ item.tenant_name }} \
      -ko {{ item.tokens.webapi_ro }} \
      -kw {{ item.tokens.webapi_rw }}
    chdir:
      "{{ poem_virtenv_path }}"
  when: poem_token_query.rowcount == 0
  changed_when: poem_token_query.rowcount == 0


- name: Query whether REST-API token exist - {{ item.tenant_name }}
  vars:
    ansible_python_interpreter: "{{ poem_virtenv_path }}/bin/python"
  community.postgresql.postgresql_query:
    db: "{{ poem_db_name }}"
    login_host: localhost
    login_user: "{{ poem_db_user }}"
    login_password: "{{ poem_db_password }}"
    search_path: "{{ item.tenant_name }}"
    query: "SELECT 1 FROM api_myapikey where name='{{ item.tenant_name | upper }}'"
  register: poem_token_query
  failed_when: false


- name: Set REST-API token - {{ item.tenant_name }}
  ansible.builtin.shell:
    cmd: |
      source {{ poem_virtenv_path }}/bin/activate
      poem-token restapi -t {{ item.tenant_name }} \
      -k {{ item.tokens.restapi }}
    chdir:
      "{{ poem_virtenv_path }}"
  when: poem_token_query.rowcount == 0
  changed_when: poem_token_query.rowcount == 0
