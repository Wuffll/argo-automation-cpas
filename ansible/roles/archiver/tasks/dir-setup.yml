---
- name: Create metric result store directory
  ansible.builtin.file:
    path: "{{ archiver_virtenv_path }}/var/lib/{{ item.tenant_name }}"
    state: directory
    mode: "0755"
  loop: "{{ archiver_tenants }}"

- name: Set permissions on metric results store directory
  ansible.builtin.file:
    path: "{{ archiver_virtenv_path }}/var/lib/{{ item.tenant_name }}"
    state: directory
    owner: "{{ owner_archiver }}"
    group: "{{ group_archiver }}"
    mode: "0755"
  loop: "{{ archiver_tenants }}"
  when: owner_archiver is defined and group_archiver is defined
