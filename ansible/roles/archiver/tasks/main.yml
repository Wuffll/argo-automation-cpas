---
# tasks file for archiver

- name: Check if ams-consumer wheel installed
  ansible.builtin.shell:
    cmd: |
      source {{ archiver_virtenv_path }}/bin/activate
      #      pip3 list | grep ams-consumer
    chdir: "{{ archiver_virtenv_path }}"
  register: out_pipinst
  ignore_errors: true
  changed_when: false

- name: Set archiver_is_installed fact
  ansible.builtin.set_fact:
    archiver_is_installed: "{{ out_pipinst.rc == 0 }}"

- name: Setup newly added tenants
  ansible.builtin.import_tasks: ./add-tenants.yml
  when: archiver_is_installed and archiver_tenants is defined

- name: Process removal of pending tenants
  ansible.builtin.import_tasks: ./remove-tenants.yml
  when: archiver_is_installed and archiver_remove_tenants is defined
# vim: ft=yaml.ansible
