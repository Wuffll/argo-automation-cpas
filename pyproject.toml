[project]
name = "argo-automation-cpas"
dynamic = ["version"]
license = "Apache-2.0"
readme = "README.md"
authors = [
	{ name = "Daniel Vrcic", email ="daniel.vrcic@gmail.com" }
]
description = "Automation service for the dynamic configuration of ARGO components: Connectors, POEM, Archiver and Sensu (CPAS)."
dependencies = [
	"aiohttp==3.11.0",
	"ansible-core==2.18.0",
	"ansible-runner==2.4.0",
	"argo-ams-library"
]
requires-python = ">=3.12"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
aiohttp = "*"
ansible-core = "*"
ansible-runner = "*"
argo-ams-library = "*"

[tool.poetry.group.devel.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.25.0"
ruff = "^0.11.0"
build = "*"
pdbpp = "*"

[project.scripts]
argo_cpas = "argo_automation_cpas.cli.argo_cpas:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools]
packages = [
	'argo_automation_cpas',
	'argo_automation_cpas.cli',
]

[tool.setuptools.package-dir]
argo_automation_cpas = "src/argo_automation_cpas/"
"argo_automation_cpas.cli" = "src/cli/"

[tool.setuptools.data-files]
"etc" = ["config/argo-cpas.conf.template"]
"var/log" = ["var/log/.keep"]
"ansible/project" = [
	"ansible/project/ansible.cfg",
	"ansible/project/init.yml",
	"ansible/project/connectors.yml",
]
"ansible/inventory" = [
	"ansible/inventory/connectors.ini",
]
"ansible/roles/connector/defaults" = [
	"ansible/roles/connector/defaults/main.yml",
]
"ansible/roles/connector/handlers" = [
	"ansible/roles/connector/handlers/main.yml",
]
"ansible/roles/connector/tasks" = [
	"ansible/roles/connector/tasks/main.yml",
	"ansible/roles/connector/tasks/conf-setup.yml",
	"ansible/roles/connector/tasks/cron-setup.yml",
	"ansible/roles/connector/tasks/remove_tenants.yml",
]
"ansible/roles/connector/templates" = [
	"ansible/roles/connector/templates/combine.yml.j2",
	"ansible/roles/connector/templates/customer.conf.j2",
	"ansible/roles/connector/templates/global.conf.j2",
]
"ansible/roles/connector/vars" = [
	"ansible/roles/connector/vars/main.yml",
]

[tool.setuptools.dynamic]
version = { attr = "version.vernum" }
