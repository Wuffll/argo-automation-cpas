[tool.poetry]
name = "argo-automation-cpas"
version = "0.1.0"
description = "Automation service for the dynamic configuration of ARGO components: Connectors, POEM, Archiver, and Sensu (CPAS)."
authors = []
license = "Apache-2.0"
readme = "README.md"
packages = [{ include = "argo_automation_cpas", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
aiohttp = "^3.11.0"
ansible-core = "^2.18.0"
ansible-runner = "^2.4.0"
argo-ams-library = "*"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.25.0"
ruff = "^0.11.0"

[tool.poetry.scripts]
argo-automation-cpas = "argo_automation_cpas.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
