      - $HOME:/mnt
      - $HOME/.docker_zsh_history:/home/user/.zsh_history
      - /dev/log:/dev/log
      - /etc/localtime:/etc/localtime:ro
      - type: bind
        source: ${SSH_AUTH_SOCK}
        target: ${SSH_AUTH_SOCK}
    environment:
      - SSH_AUTH_SOCK
    networks:
      argo-automation-play:
        ipv4_address: 172.21.0.15

  poem:
