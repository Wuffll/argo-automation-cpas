services:
  controller:
    env_file:
      - compose.env
    image: ${IMAGEC}
    command: sudo /usr/bin/supervisord -nc /etc/supervisor/supervisord.conf
    entrypoint: /sbin/init
    container_name: auto-controller
    privileged: true
    hostname: controller
    cgroup: host
    tty: true
    tmpfs:
      - /run
      - /tmp
    stdin_open: true
    user: root
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup
      - $HOME:/mnt
      - $HOME/.docker_zsh_history:/home/user/.zsh_history
      - /dev/log:/dev/log
      - /etc/localtime:/etc/localtime:ro
      - ../:/home/user/argo-cpas-source/
      - type: bind
        source: ${SSH_AUTH_SOCK}
        target: ${SSH_AUTH_SOCK}
    environment:
      - SSH_AUTH_SOCK

    networks:
      argo-automation-play:
        ipv4_address: 172.21.0.12

  connectors:
    env_file:
      - compose.env
    image: ${IMAGES1}
    command: sudo /usr/bin/supervisord -nc /etc/supervisord.conf
    entrypoint: /sbin/init
