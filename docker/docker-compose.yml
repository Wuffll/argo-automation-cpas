    tmpfs:
      - /run
      - /tmp
    stdin_open: true
    user: root
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup
      - $HOME:/mnt
      - $HOME/.docker_zsh_history:/home/user/.zsh_history
      - /dev/log:/dev/log
      - /etc/localtime:/etc/localtime:ro
      - type: bind
        source: ${SSH_AUTH_SOCK}
        target: ${SSH_AUTH_SOCK}
    environment:
      - SSH_AUTH_SOCK
    networks:
      argo-automation-play:
        ipv4_address: 172.21.0.15

  poem:
    env_file:
      - compose.env
    image: ${IMAGES2}
    command: sudo /usr/bin/supervisord -nc /etc/supervisord.conf
    entrypoint: /sbin/init
    container_name: auto-poem
    hostname: poem
    cgroup: host
    tty: true
    tmpfs:
      - /run
      - /tmp
    stdin_open: true
    user: root
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup
      - $HOME:/mnt
      - $HOME/.docker_zsh_history:/home/user/.zsh_history
      - /dev/log:/dev/log
      - /etc/localtime:/etc/localtime:ro
      - type: bind
        source: ${SSH_AUTH_SOCK}
